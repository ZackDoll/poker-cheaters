# Local development database. The credentials are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poker_db_data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  poker_db_data:
